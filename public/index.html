<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magda Castro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
  </style>
  <script src="https://kit.fontawesome.com/49aedbed0c.js" crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>
  <form className="form" data-netlify="true" netlify-honeypot="bot-field" form-name="contact" hidden>
    <input type="text" placeholder="Nombre" name='name' />
    <input type="tel" placeholder="Teléfono" name='phone' />
    <input type="email" placeholder="Email" name='email' />
    <input type="hidden" name="bot-field" />
    <textarea placeholder="Me gustaría una escultura / pintura / personaje sobre…" rows={6} name='message' />
    <button className="main-btn" type="submit">Enviar</button>
  </form>
</body>

</html>
